# 通过 npm Trusted Publishing（GitHub Actions OIDC）发布到 npm —— 不需要 token、不需要 OTP。
#
# 前置（一次性，在 npm 网页配置）：
#   npmjs.com → 包 dsh-calibguard → Settings → Trusted Publisher → GitHub Actions
#     Organization or user: maomitgd2006
#     Repository:            DSH_CG
#     Workflow filename:     publish.yml
#     Allowed actions:       Allow `npm publish`
#   然后点 "Set up connection"。
#
# 之后：Actions 页手动运行本 workflow，或推送 v* tag 自动发布。
name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # OIDC：npm 根据它验证"这个 workflow 来自该仓库"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # npm 可信发布要求 npm >= 11.5.1；Node 24 自带的 npm 已满足
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Show toolchain
        run: |
          node -v
          npm -v

      - name: Pack sanity check（包内容不应含 test/）
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          if grep -E '^npm notice .* (test/|scripts/)' /tmp/pack.txt; then
            echo "::error::发布包里不应包含 test/ 或 scripts/"
            exit 1
          fi

      - name: Publish (OIDC, with provenance)
        run: npm publish --provenance --access public
