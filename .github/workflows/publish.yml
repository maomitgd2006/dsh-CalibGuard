# 通过 npm Trusted Publishing（GitHub Actions OIDC）发布到 npm —— 不需要 token、不需要 OTP。
#
# ⚠️ 当前状态：**未启用**（暂用手工 `npm publish` + bypass token 发布）。
#    启用步骤（一次性）：
#      npmjs.com → 包 dsh-calibguard → Settings → Trusted Publisher → GitHub Actions
#        Organization or user: maomitgd2006
#        Repository:            DSH_CG
#        Workflow filename:     publish.yml
#        Allowed actions:       Allow `npm publish`
#      然后点 "Set up connection"，再把下面 on.push.tags 打开即可自动发布。
#    未配置时请勿手动触发本 workflow：npm 会返回 404（OIDC 身份不被认可）。
#
# 使用：Actions 页手动 Run workflow（配置好 Trusted Publisher 之后）。
name: publish

on:
  workflow_dispatch:
  # 配置 Trusted Publisher 后可启用 tag 自动发布：
  # push:
  #   tags:
  #     - 'v*'

permissions:
  contents: read
  id-token: write # OIDC：npm 根据它验证"这个 workflow 来自该仓库"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 已发布的版本不要重复发（避免手动 rerun 时 409）
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Skip if version already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "dsh-calibguard@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::dsh-calibguard@$VERSION 已存在，跳过发布"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack sanity check（包内容不应含 test/）
        if: steps.check.outputs.already == 'false'
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          if grep -E '^npm notice .* (test/|scripts/)' /tmp/pack.txt; then
            echo "::error::发布包里不应包含 test/ 或 scripts/"
            exit 1
          fi

      - name: Publish (OIDC, with provenance)
        if: steps.check.outputs.already == 'false'
        run: npm publish --provenance --access public